schema_version: 1
as_of: '2026-11-15'
scope:
  excluded_globs:
  - micro-app/spreadsheet/**
  - ide-plugins/**
  - '**/node_modules/**'
  - '**/target/**'
  - .worktrees/**
  - '**/dist/**'
  - '**/tmp/**'
  path_semantics:
    root: repository
    separator: /
    case_sensitive: true
    symlinks: reject
    glob_grammar: segment-star-double-star
discovery:
  maven:
    parser: xml
    manifest_glob: '**/pom.xml'
    direct_selector: /project/dependencies/dependency
    management_selector: /project/dependencyManagement/dependencies/dependency
  npm:
    parser: json
    manifest_glob: '**/package.json'
    lockfile_name: package-lock.json
  junit4_source:
    source_glob: '**/src/test/**/*.java'
    import_rule: (?m)^\s*import\s+org\.junit\.(?!jupiter(?:\.|;)|platform(?:\.|;))
    static_imports: excluded
    expected_file_count: 135
evidence:
# Evidence references point to maintained contracts, source and behavior tests.
# Enforceable repository state is scanned independently by the rules below.
- id: E-SCHEMA
  kind: file
  artifacts:
  - path: docs/design/automation-checks.md
  - path: scripts/ci/tests/test_verify_dependency_policy.py
  selector:
    language: exists
    expression: dependency policy design and verifier behavior tests
  expected:
    type: scalar
    value: true
- id: E-GROOVY-MANIFESTS
  kind: xml
  artifacts:
  - path: bom/pom.xml
  - path: libs/common/common-script/pom.xml
  - path: ability/ouroboros-organization-structure/ouroboros-organization-structure-runtime/pom.xml
  - path: core/ouroboros-approval-workflow/pom.xml
  - path: core/ouroboros-data/pom.xml
  - path: platform/ouroboros-mothership/pom.xml
  - path: platform/ouroboros-develop/pom.xml
  - path: security/ouroboros-web-security/ouroboros-web-security-rbac-manage/pom.xml
  selector:
    language: xpath
    expression: groovy direct and managed dependencies
  expected:
    type: mapping
    value:
      apache_groovy: org.apache.groovy:groovy:4.0.30
      default_runtime_path: libs/common/common-script
      legacy_boundary: legacy-compat/quickbuilder
- id: E-GROOVY-RUNTIME-TREE
  kind: markdown-section
  artifacts:
  - path: docs/design/cross-cutting/template-and-script-runtime.md
  selector:
    language: markdown-heading
    expression: '## Groovy 运行时依赖'
  expected:
    type: contains-lines
    value:
    - 默认运行时通过 `common-script` 引入 `org.apache.groovy:groovy`，版本由 BOM 统一管理。
    - 默认运行时排除 `org.codehaus.groovy:*` 与 `groovy-all`。
- id: E-FE-MANIFEST-MAP
  kind: json
  artifacts:
  - path: package.json
  - path: docs/handbook/package.json
  - path: frontends/web/package.json
  - path: frontends/web/main-app/package.json
  - path: frontends/web/ouroboros-approval-workflow-designer/package.json
  - path: frontends/web/ouroboros-debug-console-topbar/package.json
  - path: frontends/web/ouroboros-debug-console-topbar/package-lock.json
  - path: frontends/web/ouroboros-logicflow-editor/package.json
  - path: frontends/web/ouroboros-logicflow-editor/package-lock.json
  - path: frontends/web/ouroboros-logicflow-editor/src/package.json
  - path: frontends/web/ouroboros-sdk/package.json
  - path: frontends/web/script-editor-intelligence-mock-server/package.json
  selector:
    language: json-pointer
    expression: /dependencies,/devDependencies,/scripts
  expected:
    type: mapping
    value:
      manifests: 10
      install_roots: 9
      locks: 9
      missing_locks: 0
      non_install_manifests: 1
- id: E-JUNIT-SOURCE
  kind: source-scan
  artifacts:
  - path: bom/pom.xml
  selector:
    language: regex
    expression: (?m)^\s*import\s+org\.junit\.(?!jupiter(?:\.|;)|platform(?:\.|;))
  expected:
    type: count
    value: 137
- id: E-JUNIT-DECLARATIONS
  kind: xml
  artifacts:
  - path: bom/pom.xml
  selector:
    language: xpath
    expression: junit vintage and junit direct declarations
  expected:
    type: mapping
    value:
      direct_vintage: 25
      management_vintage: 1
      direct_junit: 0
- id: E-JUNIT-EFFECTIVE
  kind: xml
  artifacts:
  - path: bom/pom.xml
  selector:
    language: xpath
    expression: local parent chain effective owner mapping
  expected:
    type: mapping
    value:
      covered: 137
      uncovered: 0
- id: E-APPROVAL-POMS
  kind: xml
  artifacts:
  - path: core/ouroboros-approval-workflow/pom.xml
  - path: core/ouroboros-approval-workflow/ouroboros-approval-workflow-runtime/pom.xml
  - path: core/ouroboros-approval-workflow/ouroboros-approval-workflow-qb-spring-boot-starter/pom.xml
  selector:
    language: xpath
    expression: approval workflow runtime dependencies and modules
  expected:
    type: mapping
    value:
      positive: ouroboros-approval-workflow-flowable
      negative: ouroboros-approval-workflow-activiti6
- id: E-APPROVAL-ADR
  kind: markdown-section
  artifacts:
  - path: core/ouroboros-approval-workflow/docs/engine-routing-decision.md
  selector:
    language: markdown-heading
    expression: '## Decision'
  expected:
    type: contains-lines
    value:
    - 'Chosen default production path: `flowable`'
    - '`activiti6` may not remain bundled into the default `runtime` or default starter artifacts'
