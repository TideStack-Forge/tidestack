spring:
  cache:
    type: simple

  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  datasource:
    url: jdbc:h2:mem:configuration_runtime;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  liquibase:
    enabled: false

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
