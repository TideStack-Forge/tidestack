03ctext x=\"1144\" y=\"296\" class=\"detail\">数据建模 · 流程编排 · 页面配置\u003c/text>\n        \u003c/g>\n        \u003cg data-node=\"application-assets\" style=\"--node-fill:url(#study-wash-orange);--node-rule:var(--diagram-orange-rule);--node-ink:var(--diagram-orange-ink)\">\n          \u003crect x=\"264\" y=\"336\" width=\"1072\" height=\"52\" rx=\"8\" fill=\"var(--paper-2)\" stroke=\"var(--rule-solid)\" />\n          \u003crect x=\"284\" y=\"348\" width=\"28\" height=\"28\" rx=\"6\" class=\"study-icon-plate\" aria-hidden=\"true\" />\u003cuse href=\"#foundation-icon-assets\" x=\"288\" y=\"352\" width=\"20\" height=\"20\" class=\"section-icon\" aria-hidden=\"true\" />\n          \u003ctext x=\"316\" y=\"368\" class=\"label\">应用资产\u003c/text>\n          \u003ctext x=\"520\" y=\"368\" class=\"body\">模型元数据\u003c/text>\n          \u003cline x1=\"704\" y1=\"352\" x2=\"704\" y2=\"372\" stroke=\"var(--rule-solid)\" />\n          \u003ctext x=\"756\" y=\"368\" class=\"body\">业务代码\u003c/text>\n          \u003cline x1=\"940\" y1=\"352\" x2=\"940\" y2=\"372\" stroke=\"var(--rule-solid)\" />\n          \u003ctext x=\"996\" y=\"368\" class=\"body\">扩展包与前端资源\u003c/text>\n        \u003c/g>\n\n        \u003ctext x=\"64\" y=\"452\" class=\"label\">统一应用基座\u003c/text>\n        \u003ctext x=\"1536\" y=\"452\" class=\"detail\" text-anchor=\"end\">前后端能力协同 · 按需装配与组合\u003c/text>\n\n        \u003cg id=\"identity-and-governance\" data-node=\"identity-and-governance\" style=\"--node-fill:url(#study-wash-rose);--node-rule:var(--diagram-rose-rule);--node-ink:var(--diagram-rose-ink)\">\n          \u003crect x=\"60\" y=\"468\" width=\"180\" height=\"1092\" rx=\"8\" class=\"rail\" />\n          \u003crect x=\"60\" y=\"468\" width=\"180\" height=\"1092\" rx=\"8\" class=\"rail-texture\" aria-hidden=\"true\" />\n          \u003crect x=\"76\" y=\"480\" width=\"28\" height=\"28\" rx=\"6\" class=\"study-icon-plate\" aria-hidden=\"true\" />\u003cuse href=\"#foundation-icon-shield\" x=\"80\" y=\"484\" width=\"20 rect x=\"456.0\" y=\"920\" width=\"208\" height=\"25\" rx=\"3\" class=\"diagram-paper\"/>\u003ctext x=\"560.0\" y=\"938\" font-size=\"16\" text-anchor=\"middle\" class=\"diagram-label-teal\">输出校验与事务／审计处理\u003c/text>\n\u003crect x=\"588.0\" y=\"1048\" width=\"224\" height=\"25\" rx=\"3\" class=\"diagram-paper\"/>\u003ctext x=\"700.0\" y=\"1066\" font-size=\"16\" text-anchor=\"middle\" class=\"diagram-label-violet\">直接调用逻辑流或代码处理器\u003c/text>\n\u003crect x=\"1024.0\" y=\"1108\" width=\"192\" height=\"25\" rx=\"3\" class=\"diagram-paper\"/>\u003ctext x=\"1120.0\" y=\"1126\" font-size=\"16\" text-anchor=\"middle\" class=\"diagram-label-violet\">按实现需要调用数据服务\u003c/text>\n\u003crect x=\"1080.0\" y=\"1168\" width=\"80\" height=\"25\" rx=\"3\" class=\"diagram-paper\"/>\u003ctext x=\"1120.0\" y=\"1186\" font-size=\"16\" text-anchor=\"middle\" class=\"diagram-label-violet\">返回数据\u003c/text>\n\u003crect x=\"644.0\" y=\"1228\" width=\"112\" height=\"25\" rx=\"3\" class=\"diagram-paper\"/>\u003ctext x=\"700.0\" y=\"1246\" font-size=\"16\" text-anchor=\"middle\" class=\"diagram-label-violet\">返回处理结果\u003c/text>\n\u003crect x=\"200.0\" y=\"1308\" width=\"160\" height=\"25\" rx=\"3\" class=\"diagram-paper\"/>\u003ctext x=\"280.0\" y=\"1326\" font-size=\"16\" text-anchor=\"middle\" class=\"diagram-label-blue\">返回响应并更新页面\u003c/text>\n\u003ctext x=\"40\" y=\"218\" font-size=\"18\" text-anchor=\"start\" font-weight=\"600\" class=\"diagram-muted\">打开页面\u003c/text>\n\u003ctext x=\"40\" y=\"458\" font-size=\"18\" text-anchor=\"start\" font-weight=\"600\" class=\"diagram-muted\">执行业务操作\u003c/text>\n\u003ctext x=\"336\" y=\"592\" font-size=\"17\" text-anchor=\"start\" font-weight=\"600\" class=\"diagram-muted\">业务动作接口\u003c/text>\n\u003ctext x=\"336\" y=\"1032\" font-size=\"17\" text-anchor=\"start\" font-weight=\"600\" class=\"diagram-muted\">逻辑流接口／代码接口\u003c/text>\n\u003ctext x=\"700\" y=\"1404\" font-size=\"17\" text-anchor=\"middle\" class=\"diagram-muted\">业务动作和普通接口保留不同入口；WebAPI 通过实现调用数据服务，不直接连接数据模型。\u003c/text>\n\u003c/svg>\u003c/main>\u003c/body>\u003c/html>"}};
let variant='refined';
function applyTheme(frame){const root=frame.contentDocument?.documentElement;if(root)root.dataset.theme=document.documentElement.dataset.theme}
for(const frame of document.querySelectorAll('iframe'))frame.addEventListener('load',()=>applyTheme(frame));
for(const button of document.querySelectorAll('[data-theme-choice]'))button.addEventListener('click',()=>{document.documentElement.dataset.theme=button.dataset.themeChoice;for(const item of document.querySelectorAll('[data-theme-choice]'))item.setAttribute('aria-pressed',String(item===button));for(const frame of document.querySelectorAll('iframe'))applyTheme(frame)});
for(const button of document.querySelectorAll('[data-tab]'))button.addEventListener('click',()=>{for(const item of document.querySelectorAll('[data-tab]'))item.setAttribute('aria-pressed',String(item===button));for(const section of document.querySelectorAll('.study'))section.hidden=section.id!=='study-'+button.dataset.tab});
for(const button of document.querySelectorAll('[data-variant]'))button.addEventListener('click',()=>{variant=button.dataset.variant;for(const item of document.querySelectorAll('[data-variant]'))item.setAttribute('aria-pressed',String(item===button));for(const frame of document.querySelectorAll('iframe'))frame.srcdoc=documents[frame.dataset.key][variant]});
</script></body></html>
