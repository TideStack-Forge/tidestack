{
  "id": "runtimes/develop",
  "title": "Develop Runtime",
  "class": "runtimes",
  "capabilities": [
    "backend-runtime",
    "develop-surface",
    "local-preflight"
  ],
  "lifecycle": {
    "up": "",
    "check": "HTTP probe /actuator/health -> 200; lifecycle 503 means runtime is not ready",
    "reset": "",
    "down": ""
  },
  "inputs": [
    {
      "name": "baseUrl",
      "required": false,
      "description": "Develop runtime base URL, typically provided by --base-url or OB_TEST_BASE_URL"
    }
  ],
  "outputs": [
    {
      "name": "runtimeKind",
      "value": "develop"
    },
    {
      "name": "baseUrlEnv",
      "value": "OB_TEST_BASE_URL"
    },
    {
      "name": "unauthenticatedProbe",
      "value": "/api/auth/authorities"
    },
    {
      "name": "healthProbe",
      "value": "/actuator/health"
    }
  ],
  "healthChecks": [
    {
      "name": "actuator-health",
      "expect": "200 from /actuator/health; 503 means LifecycleGuardFilter is still blocking readiness"
    },
    {
      "name": "local-runtime-integrity",
      "expect": "main jar, loader.path, and open jars remain present when running on localhost"
    }
  ],
  "prerequisites": [],
  "notes": [
    "Use this fixture when metadata and develop-side management routes are the primary target.",
    "A live process is not enough; HTTP probe and artifact integrity must both be valid before using it as merge gate baseline."
  ]
}
