services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: ob-test-openldap
    environment:
      LDAP_ORGANISATION: "Ouroboros Test Org"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "${OB_TEST_LDAP_ADMIN_PASSWORD:-admin}"
    ports:
      - "${OB_TEST_LDAP_PORT:-1389}:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -D cn=admin,dc=example,dc=org -w ${OB_TEST_LDAP_ADMIN_PASSWORD:-admin} -b dc=example,dc=org -s base '(objectclass=*)' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
