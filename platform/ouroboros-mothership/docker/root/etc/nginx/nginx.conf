worker_processes auto;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile             on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    include             /app/deploy/nginx/conf.d/*.conf;

    gzip              on;
    gzip_min_length   1k;
    gzip_buffers      4 16k;
    gzip_http_version 1.1;
    gzip_comp_level   5;
    gzip_types text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        font/ttf
        image/svg+xml
        image/bmp;
    gzip_proxied any;
    gzip_static on;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    server {
        listen      80;
        server_name _;

        access_log /app/deploy/logs/web/access.log;
        error_log /app/deploy/logs/web/error.log;

        location ^~ /actuator/ {
            proxy_pass              http://localhost:8080;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location ^~ /api/ {
            # CORS
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, token" always;
            add_header Access-Control-Allow-Credentials true always;
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass              http://localhost:8080;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            client_max_body_size    2G;
        }

        # /file/* 走反向代理到后端
        location ^~ /file/ {
            # CORS
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, token" always;
            add_header Access-Control-Allow-Credentials true always;
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass              http://localhost:8080;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location ^~ /websocket/ {
            # CORS
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;

            proxy_pass              http://localhost:8080;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade $http_upgrade;
            proxy_set_header        Connection "upgrade";
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # 静态资源开启缓存
        location ~* ^.*?\.(js|css|jpg|jpeg|png|gif|ico|svg|bmp|webp|ttf|woff|woff2|eot|otf|mp3|mp4|webm|avi|mpeg|flv|swf|wav|mid|midi|m4a|m4v|aac|flac)$ {
            add_header Cache-Control "public, max-age=31536000";
            add_header Pragma "public";
            expires 31536000;

            root            /app/base/web/;
            try_files       $uri @another-root-static;
        }

        # html、json、xml 等会频繁变动，不缓存
        location ~* ^.*?(\.json|\.xml|\.html)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;

            root            /app/base/web/;
            try_files       $uri @another-root-static;
        }

        location / {
            root            /app/base/web/;
            index           index.html;

            try_files       $uri $uri/index.html @another-root-index;
        }
        location @another-root-index {
          root            /app/deploy/web/;
          try_files       $uri $uri/index.html @rewrite-to-index;
        }

        location @another-root-static {
          root            /app/deploy/web/;
          try_files       $uri =404;
        }

        location @rewrite-to-index {
            rewrite ^.*$ /index.html last;
        }
    }
}
